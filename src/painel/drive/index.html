<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liberar arquivo · Fiel</title>
<link rel="icon" href="/app/favicon.png">
<style>
  :root{--papel:#FAF5EC;--tinta:#211D1A;--mudo:#6E645B;--coral:#E85D4A;--sage:#5B8266;--linha:#E5DCCA}
  @media (prefers-color-scheme: dark){:root{--papel:#1A1613;--tinta:#F5EDE0;--mudo:#B5A896;--linha:#332B22}}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--papel);color:var(--tinta);font:16px/1.5 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
  .cartao{max-width:420px;width:100%;text-align:center}
  img{height:40px;margin-bottom:18px}
  h1{font:600 24px Georgia,serif;margin:0 0 10px}
  p{color:var(--mudo);margin:0 0 20px}
  button{background:var(--coral);color:#fff;border:0;border-radius:99px;padding:13px 26px;font-size:16px;cursor:pointer}
  button:disabled{opacity:.5}
  .ok{color:var(--sage);font-weight:600}
  .erro{color:var(--coral)}
  small{display:block;margin-top:22px;color:var(--mudo);font-size:13px}
</style>
</head>
<body>
<div class="cartao">
  <img src="/app/fiel-logo.png" alt="Fiel">
  <h1 id="titulo">Liberar no seu Google Drive</h1>
  <p id="texto">Escolha o arquivo no seu Drive. O Fiel passa a acessar só o que você selecionar — nada além disso.</p>
  <button id="abrir" disabled>Carregando…</button>
  <small>O seletor é do próprio Google. Você pode revogar o acesso quando quiser em myaccount.google.com → Segurança → Apps conectados.</small>
</div>
<script>
const t = new URLSearchParams(location.search).get('t');
const $ = (s) => document.querySelector(s);
let cfg = null;
function msg(titulo, texto, classe) { $('#titulo').textContent = titulo; $('#texto').textContent = texto; $('#texto').className = classe || ''; }
async function iniciar() {
  if (!t) return msg('Link incompleto', 'Peça de novo no chat do Fiel.', 'erro');
  try { cfg = await fetch('/api/google/picker?t=' + encodeURIComponent(t)).then(r => r.json()); } catch { cfg = { erro: 'sem conexão' }; }
  if (cfg.erro) { $('#abrir').hidden = true; return msg('Não deu para abrir', cfg.erro, 'erro'); }
  if (cfg.pasta) msg('Escolher a pasta', 'Selecione a pasta do seu Drive onde o Fiel deve guardar os documentos.');
  const s = document.createElement('script'); s.src = 'https://apis.google.com/js/api.js';
  s.onload = () => gapi.load('picker', () => { $('#abrir').disabled = false; $('#abrir').textContent = cfg.pasta ? 'Escolher pasta' : 'Escolher no Drive'; $('#abrir').onclick = abrir; abrir(); });
  document.head.appendChild(s);
}
function abrir() {
  const view = new google.picker.DocsView(google.picker.ViewId.DOCS).setIncludeFolders(true);
  if (cfg.pasta) view.setSelectFolderEnabled(true).setMimeTypes('application/vnd.google-apps.folder');
  if (cfg.ids && cfg.ids.length && view.setFileIds) view.setFileIds(cfg.ids.join(','));
  const p = new google.picker.PickerBuilder().addView(view).setOAuthToken(cfg.token).setDeveloperKey(cfg.chave).setAppId(cfg.app_id)
    .setLocale('pt-BR').setTitle(cfg.pasta ? 'Escolha a pasta' : 'Escolha o arquivo').enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
    .setCallback(async (d) => {
      if (d.action !== google.picker.Action.PICKED) return;
      $('#abrir').disabled = true; msg('Liberando…', 'Um instante.');
      const r = await fetch('/api/google/picker', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t, escolhidos: d.docs.map(x => ({ id: x.id, nome: x.name, mime: x.mimeType })) }) }).then(r => r.json()).catch(() => ({ erro: 'sem conexão' }));
      if (r.erro) { $('#abrir').disabled = false; return msg('Não consegui', r.erro, 'erro'); }
      $('#abrir').hidden = true; msg('✅ Pronto', r.mensagem || 'Liberado. Pode voltar para a conversa.', 'ok');
    }).build();
  p.setVisible(true);
}
iniciar();
</script>
</body>
</html>
